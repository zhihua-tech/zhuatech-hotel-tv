<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华酒店电视运营中心</title><link rel="stylesheet" href="/styles.css"></head><body><div class="shell"><aside class="side"><div class="brand">ZHUATECH HOTEL<small>上海如静知华信息科技有限公司</small></div><div class="nav"><span class="active">运营总览</span><span>客房与入住</span><span>电视终端</span><span>内容编排</span><span>客需服务</span><span>应急广播</span><span>审计中心</span></div></aside><main class="main"><div class="top"><div><div class="eyebrow">Hospitality operations</div><h1>酒店智慧电视运营中心</h1><div class="sub">客房状态、内容触达与服务履约集中管理</div></div><div class="status">● 平台运行正常</div></div><section class="metrics" id="metrics"></section><section class="grid"><div class="card"><h2>客房与电视状态</h2><div class="rooms" id="rooms"></div></div><div class="card"><h2>待处理客需服务</h2><div class="orders" id="orders"></div></div></section><section class="card" style="margin-top:18px"><h2>终端健康</h2><table><thead><tr><th>序列号</th><th>型号</th><th>应用版本</th><th>状态</th><th>最后心跳</th></tr></thead><tbody id="devices"></tbody></table></section></main></div><script>const api='/api/dashboard',headers={'x-api-key':'zhuatech-demo-key'};fetch(api,{headers}).then(r=>r.json()).then(d=>{const labels={rooms:'客房',occupied:'在住房',devices:'电视终端',onlineDevices:'在线',activeContent:'有效内容',pendingServices:'待办服务'};metrics.innerHTML=Object.entries(d.metrics).map(([k,v])=>`<div class="metric"><span>${labels[k]||k}</span><b>${v}</b></div>`).join('');rooms.innerHTML=d.rooms.map(r=>`<div class="room ${r.status}"><strong>${r.number}</strong><small>${r.type} · ${r.status==='occupied'?'在住':'空闲'}</small></div>`).join('');orders.innerHTML=d.serviceOrders.filter(o=>o.status!=='completed').map(o=>`<div class="order"><b>${o.category} · 房间 ${d.rooms.find(r=>r.id===o.roomId)?.number||'-'}</b><small>${o.description} · ${o.status}</small></div>`).join('')||'<div class="sub">暂无待办</div>';devices.innerHTML=d.devices.map(x=>`<tr><td>${x.serial}</td><td>${x.model}</td><td>${x.appVersion}</td><td>${x.status}</td><td>${new Date(x.lastHeartbeatAt).toLocaleString()}</td></tr>`).join('')}).catch(()=>document.body.dataset.error='dashboard');</script></body></html>
